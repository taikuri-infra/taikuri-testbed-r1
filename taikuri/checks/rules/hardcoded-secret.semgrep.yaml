# security-starter / hardcoded-secret
#
# High-signal, low-false-positive secret detection across Go and TypeScript/JS.
#
# Two layers:
#   1. Well-known key shapes (Stripe sk_live_, GitHub ghp_, AWS AKIA…) via
#      generic regex — truly multi-language and specific enough that prose and
#      comments do not match.
#   2. password / secret / api_key assigned a string literal — matched on the
#      AST (languages: go / typescript / javascript), NOT with generic regex, so
#      that a *comment* that merely looks like a secret assignment (e.g. the
#      testbed's `// plant: apiKey := "sk_live_..."` VIOLATION-SITE marker) does
#      not trip the gate. AST matching ignores comments by construction.
#
# Pinned-version note: validated on semgrep 1.152.0 (local) and 1.184.0 (Docker).
rules:
  - id: hardcoded-secret
    patterns:
      - pattern-either:
          # Stripe live secret key.
          - pattern-regex: 'sk_live_[A-Za-z0-9]{8,}'
          # GitHub personal access token (classic).
          - pattern-regex: 'ghp_[A-Za-z0-9]{36}'
          # AWS access key id.
          - pattern-regex: '\bAKIA[0-9A-Z]{16}\b'
    message: >-
      Hardcoded credential detected (well-known key shape). Secrets must never
      be committed — they live in git history forever and leak through clones.
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - '*.go'
        - '*.ts'
        - '*.tsx'
        - '*.js'
        - '*.jsx'

  # password / secret / api_key = "literal" — Go.
  - id: hardcoded-secret-assignment-go
    patterns:
      - pattern-either:
          - pattern: $K = "..."
          - pattern: $K := "..."
          - pattern: const $K = "..."
          - pattern: var $K = "..."
      - metavariable-regex:
          metavariable: $K
          regex: '(?i)(password|passwd|secret|api[_-]?key)'
      - pattern-not: $K = ""
      - pattern-not: $K := ""
    message: >-
      Credential assigned to a hardcoded string literal. Load secrets from the
      environment or a secret manager; never commit the value.
    languages: [go]
    severity: ERROR

  # password / secret / api_key = "literal" — TypeScript / JavaScript.
  - id: hardcoded-secret-assignment-ts
    patterns:
      - pattern-either:
          - pattern: $K = "..."
          - pattern: 'var $K = "..."'
          - pattern: 'const $K = "..."'
          - pattern: 'let $K = "..."'
          - pattern: '$K: "..."'
      - metavariable-regex:
          metavariable: $K
          regex: '(?i)(password|passwd|secret|api[_-]?key)'
      - pattern-not: $K = ""
    message: >-
      Credential assigned to a hardcoded string literal. Load secrets from the
      environment or a secret manager; never commit the value.
    languages: [typescript, javascript]
    severity: ERROR
