rules:
  - id: no-hardcoded-secret-vars
    pattern: |
        $VARIABLE := "$STRING"
    patterns-after: true
    message: Hardcoded string literal assigned to a secret-like variable.
    languages: [go]
    severity: ERROR
    metadata:
      secret: true
    conditions:
      - metavariable-regex: { $VARIABLE: '(?i)(secret|token|password|key)' }
      - metavariable-regex: { $STRING: '^[^$]+?$' }
