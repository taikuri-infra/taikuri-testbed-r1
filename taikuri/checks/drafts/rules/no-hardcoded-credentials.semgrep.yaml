rules:
  - id: no-hardcoded-credentials
    pattern: |
        $CRED := "$STRING"
    patterns-after: []
    message: Hardcoded credential string literal found. Use environment variables instead.
    languages: [go]
    severity: ERROR
    metadata:
      tier: blocking
    fixme: Replace the hardcoded string with a value retrieved from environment variables using os.Getenv or similar methods.
    regex:
      - pattern-regex: "(?i)^(?:password|secret|token|key|cred|auth)\b"
        metavar: CRED
      - pattern-regex: "^[a-zA-Z0-9_]+"
        metavar: STRING
    mode: taint
