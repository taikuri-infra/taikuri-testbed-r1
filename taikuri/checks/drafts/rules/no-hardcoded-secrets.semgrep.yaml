rules:
  - id: no-hardcoded-secrets
    patterns:
      - pattern: $X := "$Y"
        metavariable-regex:
          Y: ^[a-zA-Z0-9_\-]{4,}$
      - pattern: var $X = "$Y"
        metavariable-regex:
          Y: ^[a-zA-Z0-9_\-]{4,}$
    message: Hardcoded secret, API key, or token found. Use environment variables instead.
    languages: [go]
    severity: ERROR
