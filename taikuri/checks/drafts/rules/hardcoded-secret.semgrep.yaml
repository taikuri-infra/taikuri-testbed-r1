rules:
  - id: hardcoded-secret
    patterns:
      - pattern-either:
          - pattern-regex: 'sk_live_[A-Za-z0-9]{8,}'
          - pattern-regex: 'ghp_[A-Za-z0-9]{36}'
          - pattern-regex: '\bAKIA[0-9A-Z]{16}\b'
    message: Hardcoded credential detected (well-known key shape).
    languages: [generic]
    severity: ERROR
    paths:
      include: ['*.go','*.ts','*.tsx','*.js','*.jsx']
  - id: hardcoded-secret-assignment-go
    patterns:
      - pattern-either:
          - pattern: $K = "..."
          - pattern: $K := "..."
          - pattern: const $K = "..."
          - pattern: var $K = "..."
      - metavariable-regex:
          metavariable: $K
          regex: '(?i)(password|passwd|secret|api[_-]?key|token)'
      - pattern-not: $K = ""
      - pattern-not: $K := ""
    message: Credential assigned to a hardcoded string literal.
    languages: [go]
    severity: ERROR
  - id: hardcoded-secret-assignment-ts
    patterns:
      - pattern-either:
          - pattern: $K = "..."
          - pattern: 'var $K = "..."'
          - pattern: 'const $K = "..."'
          - pattern: 'let $K = "..."'
          - pattern: '$K: "..."'
      - metavariable-regex:
          metavariable: $K
          regex: '(?i)(password|passwd|secret|api[_-]?key|token)'
      - pattern-not: $K = ""
    message: Credential assigned to a hardcoded string literal.
    languages: [typescript, javascript]
    severity: ERROR
