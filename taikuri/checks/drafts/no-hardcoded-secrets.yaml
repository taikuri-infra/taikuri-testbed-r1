id: no-hardcoded-secrets
name: No hardcoded secrets, API keys, or tokens in Go
kind: semgrep
tier: blocking
scope:
    - '**/*.go'
impl: rules/no-hardcoded-secrets.semgrep.yaml
witness_format: Hardcoded secret, API key, or token found in Go source code.
repair_hint: Replace the hardcoded value with a call to os.Getenv("KEY_NAME") or a similar method to load the value from the environment.
requirement: R3@SPEC-001
