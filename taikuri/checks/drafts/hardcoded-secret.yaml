id: hardcoded-secret
name: No hardcoded secrets
code: 20234
kind: semgrep
tier: blocking
# scope is intentionally omitted: the engine's scope filter (internal/checks)
# matches with path.Match semantics and rejects `**`, so a repo-wide glob is not
# expressible. The rule file restricts scanning itself (languages + paths), which
# is the correct place for this check's targeting.
impl: rules/hardcoded-secret.semgrep.yaml
witness_format: "file:line of the hardcoded credential (key literal or assignment)"
repair_hint: >-
  Remove the literal. Read the value from an environment variable (os.Getenv /
  process.env) or a secret manager, and rotate the exposed credential — anything
  committed to git must be treated as compromised.
