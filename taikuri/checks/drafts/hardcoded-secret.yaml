id: hardcoded-secret
name: Hardcoded Secret
kind: semgrep
tier: blocking
scope:
    - '*.go'
    - '*.ts'
    - '*.tsx'
    - '*.js'
    - '*.jsx'
impl: rules/hardcoded-secret.semgrep.yaml
witness_format: A hardcoded secret or token was found in the source code at this line.
repair_hint: Remove the hardcoded value and use a secure method for handling secrets, such as environment variables or a secrets manager.
